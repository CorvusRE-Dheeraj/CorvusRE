<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; upgrade-insecure-requests" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in — CorvusRE</title>
    <meta
      name="description"
      content="Sign in or create your CorvusRE account to use CorvusPT property tax protests and CorvusDP permitting."
    />
    <!-- A login form has nothing for search results. -->
    <meta name="robots" content="noindex" />
    <!-- Clickjacking guard: on the live site, never render the sign-in form
         inside another site's frame (GitHub Pages can't send X-Frame-Options). -->
    <script>
      if (location.hostname === "corvusre.com" && window.top !== window.self) {
        document.documentElement.style.visibility = "hidden";
        try { window.top.location.replace(location.href); } catch (e) {}
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
