name: Deploy CorvusRE

# One push, one WORKFLOW RUN — this used to be two separate workflow files
# (this one for the static site, deploy-functions.yml for Supabase edge
# functions), which both triggered on every push to dev and showed up as two
# unrelated-looking entries in the Actions list. Folded into one file so a
# push to dev is one run with several jobs, not two runs — deploy-functions'
# original reasoning for being separate (a bad function deploy shouldn't
# block the site, and vice versa) is preserved by keeping it a job with no
# `needs:` on the site jobs (and its own concurrency group), not by keeping
# it a separate workflow.
#
# Phases 1/2 landed the real CorvusPT/CorvusDP apps in apps/pt, apps/dp —
# build-pt/build-dp below run their real test/e2e/build steps with each
# door's real (public, client-side-by-design) env vars, same values their
# old standalone pipelines used. Phase 4 replaced apps/identity's placeholder
# with the real shared /auth/ sign-in app (CorvusPT is the identity source —
# see supabase/dp/functions/mint-door-session for the login-bridge mechanics).

on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      project:
        description: "Edge functions: which project to redeploy in full (site jobs ignore this)"
        type: choice
        options: [both, pt, dp]
        default: both

permissions:
  contents: read
  pages: write
  id-token: write

# Workflow-level, not job-level: this makes the WHOLE RUN one participant in
# the "pages" group, so a second push can't race a Pages deploy that's still
# in flight — it does NOT serialize build-pt/build-dp/build-identity against
# each other (sibling jobs in one run aren't affected by a group set at this
# level; only concurrent RUNS are). Putting this on each site job instead
# was tried and was a real bug: jobs sharing one concurrency group compete
# for the same slot, so build-identity was getting cancelled outright while
# build-dp/build-pt fought over the other. deploy-functions below
# deliberately opts OUT of this group (its own job-level concurrency) so it
# isn't gated by Pages activity at all.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-pt:
    runs-on: ubuntu-latest
    env:
      HAS_E2E_AUTH_SECRET: ${{ secrets.E2E_TEST_EMAIL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - run: npm run test -w apps/pt

      - run: npx playwright install --with-deps chromium

      # Guest e2e subset — no sign-in needed, writes no persistent rows.
      - run: npm run test:e2e -w apps/pt
        env:
          VITE_SUPABASE_URL: https://iotzuhuajbsxxuccuihn.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_RpyqtM6EeGiT7qc3FyN5Iw_vm0aiuM3
          VITE_STRIPE_PUBLISHABLE_KEY_TEST: pk_test_51TwDPUCrbRfnYZRW05z9Huz1UlghIXZZUrR9nMF82t1Ym89ID6ZXbnGcT1Lcqdb9fFbU6z1W8e11xezYbrPSNqbj00kOMSJnE2
          VITE_STRIPE_PUBLISHABLE_KEY_LIVE: pk_live_51TwDPKE4IPC6TIHQWfh47929fIIkIIk2BrPSEWkJLAG93kCH021JNgmPHczcGxE1GG42Nmv1za7k2nTbp2fe9tqs00xTWIYCKX

      # Authenticated e2e subset — runs against a dedicated, permanent test
      # account (not a real customer); deletes any rows it creates. Gated
      # on the secret existing: E2E_TEST_EMAIL/PASSWORD live on the old
      # CorvusPT repo and don't carry over automatically (GitHub secrets
      # are write-only via API) — skips cleanly until they're added here
      # rather than failing every run in the meantime.
      - run: npm run test:e2e:auth -w apps/pt
        if: ${{ env.HAS_E2E_AUTH_SECRET == 'true' }}
        env:
          VITE_SUPABASE_URL: https://iotzuhuajbsxxuccuihn.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_RpyqtM6EeGiT7qc3FyN5Iw_vm0aiuM3
          VITE_STRIPE_PUBLISHABLE_KEY_TEST: pk_test_51TwDPUCrbRfnYZRW05z9Huz1UlghIXZZUrR9nMF82t1Ym89ID6ZXbnGcT1Lcqdb9fFbU6z1W8e11xezYbrPSNqbj00kOMSJnE2
          VITE_STRIPE_PUBLISHABLE_KEY_LIVE: pk_live_51TwDPKE4IPC6TIHQWfh47929fIIkIIk2BrPSEWkJLAG93kCH021JNgmPHczcGxE1GG42Nmv1za7k2nTbp2fe9tqs00xTWIYCKX
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}

      - run: npm run build -w apps/pt
        env:
          SITE_BASE: /corvuspt/
          VITE_SUPABASE_URL: https://iotzuhuajbsxxuccuihn.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_RpyqtM6EeGiT7qc3FyN5Iw_vm0aiuM3
          VITE_STRIPE_PUBLISHABLE_KEY_TEST: pk_test_51TwDPUCrbRfnYZRW05z9Huz1UlghIXZZUrR9nMF82t1Ym89ID6ZXbnGcT1Lcqdb9fFbU6z1W8e11xezYbrPSNqbj00kOMSJnE2
          VITE_STRIPE_PUBLISHABLE_KEY_LIVE: pk_live_51TwDPKE4IPC6TIHQWfh47929fIIkIIk2BrPSEWkJLAG93kCH021JNgmPHczcGxE1GG42Nmv1za7k2nTbp2fe9tqs00xTWIYCKX
          VITE_GOOGLE_MAPS_API_KEY: AIzaSyCxz6Q6Wit9Sq_qR6cciWs1K8zPjdM0sAI

      - uses: actions/upload-artifact@v4
        with:
          name: pt-dist
          path: apps/pt/dist/client

  build-dp:
    runs-on: ubuntu-latest
    env:
      HAS_DP_E2E_AUTH_SECRET: ${{ secrets.DP_E2E_TEST_EMAIL != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - run: npm run test -w apps/dp

      - run: npx playwright install --with-deps chromium

      # Guest e2e subset — no sign-in needed. Stops one step short of the
      # analysis wizards' final "unlock/save" CTA, which writes a real
      # `leads` row even for a signed-out visitor (see e2e/guest's specs).
      - run: npm run test:e2e -w apps/dp
        env:
          VITE_SUPABASE_URL: https://xzhilwwlfajxhklkiteb.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_zR_OjbkQ3Nto25iGKdX9mg_jRbUDWVF
          VITE_GOOGLE_MAPS_API_KEY: AIzaSyCxz6Q6Wit9Sq_qR6cciWs1K8zPjdM0sAI

      # Authenticated e2e subset — runs against a dedicated, permanent test
      # account on DP's own Supabase project (a different project than PT's,
      # so this needs its own secret pair, not PT's E2E_TEST_EMAIL/PASSWORD).
      # See e2e/authenticated/helpers.ts for how its seeded project was
      # created and how each spec cleans up after itself.
      - run: npm run test:e2e:auth -w apps/dp
        if: ${{ env.HAS_DP_E2E_AUTH_SECRET == 'true' }}
        env:
          VITE_SUPABASE_URL: https://xzhilwwlfajxhklkiteb.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_zR_OjbkQ3Nto25iGKdX9mg_jRbUDWVF
          VITE_GOOGLE_MAPS_API_KEY: AIzaSyCxz6Q6Wit9Sq_qR6cciWs1K8zPjdM0sAI
          DP_E2E_TEST_EMAIL: ${{ secrets.DP_E2E_TEST_EMAIL }}
          DP_E2E_TEST_PASSWORD: ${{ secrets.DP_E2E_TEST_PASSWORD }}

      - run: npm run build -w apps/dp
        env:
          SITE_BASE: /corvusdp/
          VITE_SUPABASE_URL: https://xzhilwwlfajxhklkiteb.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_zR_OjbkQ3Nto25iGKdX9mg_jRbUDWVF
          VITE_GOOGLE_MAPS_API_KEY: AIzaSyCxz6Q6Wit9Sq_qR6cciWs1K8zPjdM0sAI
      - uses: actions/upload-artifact@v4
        with:
          name: dp-dist
          path: apps/dp/dist/client

  build-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test -w apps/identity
      - run: npm run build -w apps/identity
        env:
          SITE_BASE: /auth/
      - uses: actions/upload-artifact@v4
        with:
          name: identity-dist
          path: apps/identity/dist/client

  assemble-and-deploy:
    needs: [build-pt, build-dp, build-identity]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pt-dist
          path: pt-dist
      - uses: actions/download-artifact@v4
        with:
          name: dp-dist
          path: dp-dist
      - uses: actions/download-artifact@v4
        with:
          name: identity-dist
          path: identity-dist

      - name: Assemble landing page + all doors into one site
        run: |
          mkdir -p site
          cp -r apps/home/. site/
          mkdir -p site/corvusbsl && cp -r apps/sbl/. site/corvusbsl/
          mkdir -p site/corvusco && cp -r apps/co/. site/corvusco/
          mkdir -p site/corvusrf && cp -r apps/rf/. site/corvusrf/
          mkdir -p site/corvuspt && cp -r pt-dist/. site/corvuspt/
          mkdir -p site/corvusdp && cp -r dp-dist/. site/corvusdp/
          mkdir -p site/auth && cp -r identity-dist/. site/auth/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Supabase edge functions — independent of the site jobs above on purpose
  # (no `needs:`, own concurrency group): a bad function deploy shouldn't
  # block the site from shipping, and vice versa. Only actually redeploys
  # whatever changed (scripts/deploy-functions.sh diffs against the base
  # commit and no-ops cleanly when nothing under functions/ changed), so
  # running this job on every push to dev — not just ones that touched
  # functions — is cheap.
  #
  # One-time setup: create an Environment named `production` (Settings ->
  # Environments), restrict its deployment branches to `dev`, and store
  # SUPABASE_ACCESS_TOKEN there as an environment secret (a personal access
  # token from https://supabase.com/dashboard/account/tokens) -- NOT as a
  # repository secret, which any branch's workflow could read. Tokens get
  # revoked/rotated -- when this job starts failing on auth, that's the
  # first thing to check.
  #
  # Manual run: Actions -> "Deploy CorvusRE" -> Run workflow -> pick a
  # `project` input (redeploys every function in the chosen project(s)).
  deploy-functions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: deploy-functions
      cancel-in-progress: false
    # Environment secrets are only released to runs on branches the environment
    # allows (set to `dev` only) -- so anyone with write access can't run this
    # job from their own branch and deploy their code to production.
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      BASE_SHA: ${{ github.event_name == 'push' && github.event.before || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy CorvusPT (identity) functions
        if: github.event_name == 'push' || inputs.project == 'both' || inputs.project == 'pt'
        run: bash scripts/deploy-functions.sh supabase/pt iotzuhuajbsxxuccuihn "$BASE_SHA"
      - name: Deploy CorvusDP functions
        # !cancelled() so a failed CorvusPT deploy doesn't also skip this one
        if: ${{ !cancelled() && (github.event_name == 'push' || inputs.project == 'both' || inputs.project == 'dp') }}
        run: bash scripts/deploy-functions.sh supabase/dp xzhilwwlfajxhklkiteb "$BASE_SHA"
